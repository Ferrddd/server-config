- name: Infra Deploy
  hosts: all
  tasks:
    - name: Install zsh
      ansible.builtin.apt:
        pkg:
        - zsh
        - curl
      become: yes
    
    - name: Change sh
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        shell: /bin/zsh
      become: yes
    
    - name: Install oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: ".oh-my-zsh"
        depth: 1
    
    - name: Install p10k
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ZSH_CUSTOM | default('.oh-my-zsh/custom') }}/themes/powerlevel10k" 
    
    - name: copy p10k config
      ansible.builtin.copy:
        src: configs/.p10k.zsh
        dest: ".p10k.zsh"

    - name: copy .zshrc
      ansible.builtin.copy:
        src: configs/.zshrc
        dest: ".zshrc"