- name: Infra Deploy
  hosts: test
  tasks:
    - name: Install zsh
      ansible.builtin.apt:
        pkg:
        - zsh
        - curl
      become: yes
    
    - name: Change sh
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        shell: /bin/zsh
      become: yes
    
    - name: Install oh-my-zsh
      ansible.builtin.shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    
    - name: Install p10k
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ZSH_CUSTOM | default('.oh-my-zsh/custom') }}/themes/powerlevel10k"
    
    - name: copy p10k config
      ansible.builtin.copy:
        src: configs/.p10k.zsh
        dest: ".p10k.zsh"

    - name: copy .zshrc
      ansible.builtin.copy:
        src: configs/.zshrc
        dest: ".zshrc"